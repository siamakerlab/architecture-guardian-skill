name: Validate Skill

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate skill metadata and policy files
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path(".")
          skill = root / "SKILL.md"
          text = skill.read_text(encoding="utf-8")

          if not text.startswith("---\n"):
              sys.exit("SKILL.md must start with YAML frontmatter")

          end = text.find("\n---\n", 4)
          if end == -1:
              sys.exit("SKILL.md frontmatter must be closed")

          frontmatter = text[4:end].strip().splitlines()
          keys = []
          for line in frontmatter:
              if not line.strip() or line.startswith(" "):
                  continue
              key = line.split(":", 1)[0].strip()
              keys.append(key)

          required = {"name", "description"}
          allowed = {"name", "description"}
          missing = required.difference(keys)
          extra = set(keys).difference(allowed)

          if missing:
              sys.exit(f"SKILL.md frontmatter missing required keys: {sorted(missing)}")
          if extra:
              sys.exit(f"SKILL.md frontmatter has unsupported keys: {sorted(extra)}")

          with (root / "core/policy/ARCHITECTURE_GUARDIAN_RULESET.json").open(encoding="utf-8") as f:
              ruleset = json.load(f)

          if not isinstance(ruleset.get("policy_version"), str):
              sys.exit("ruleset policy_version must be a string")

          banned = re.compile(r"CHANGE_REVIEW|FULL_AUDIT|compact|경량|concise mode")
          ignored = {".git", ".github", "VERSIONING.md"}
          offenders = []

          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              rel = path.relative_to(root)
              if any(part in ignored for part in rel.parts):
                  continue
              if rel.parts and rel.parts[0] == ".git":
                  continue
              try:
                  candidate = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for index, line in enumerate(candidate.splitlines(), 1):
                  if banned.search(line):
                      offenders.append(f"{rel}:{index}: {line.strip()}")

          if offenders:
              sys.exit("Banned or obsolete wording found:\n" + "\n".join(offenders))

          print("Skill metadata and policy files are valid.")
          PY
